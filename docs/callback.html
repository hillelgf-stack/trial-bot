<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Trial Bot – חיבור</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #111; --muted: #555; --accent: #0866ff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --card: #1c1c1e; --text: #f2f2f2; --muted: #aaa; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.5 system-ui, sans-serif; }
  main { max-width: 520px; margin: 48px auto; padding: 24px 16px; background: var(--card); border-radius: 16px; text-align: center; }
  button { font: inherit; padding: 14px 28px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">כמעט סיימנו</h1>
  <p id="msg">לחץ על הכפתור, ואז חזור לחלון השחור והדבק (Ctrl+V) ולחץ Enter.</p>
  <button id="copy">העתק</button>
</main>
<script>
  // The login code only lives in this page's address; nothing is sent anywhere.
  const url = location.href;
  const params = new URLSearchParams(location.search);
  const btn = document.getElementById("copy");
  if (!params.get("code")) {
    document.getElementById("title").textContent = "החיבור לא הושלם";
    document.getElementById("msg").textContent = params.get("error_description") || "לא התקבל קוד. נסה שוב מההתחלה.";
    btn.hidden = true;
  }
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(url); btn.textContent = "הועתק ✓"; }
    catch (e) { prompt("העתק את הכתובת:", url); }
  };
</script>
</body>
</html>
