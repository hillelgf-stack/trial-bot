name: sync stats

on:
  schedule:
    - cron: "30 */4 * * *"
  workflow_dispatch:

concurrency:
  group: trial-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py sync
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: save state
        if: always()
        run: |
          git config user.name "trial-bot"
          git config user.email "trial-bot@users.noreply.github.com"
          git add data DASHBOARD.md
          git diff --cached --quiet || (git commit -m "bot: sync" && git pull --rebase && git push)
