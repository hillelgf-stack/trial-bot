name: post trial reel

on:
  schedule:
    # UTC times. Israel winter = UTC+2, summer = UTC+3.
    # 07:00, 12:00, 18:00 UTC = 09:00, 14:00, 20:00 Israel (winter)
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: trial-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python bot.py post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: save state
        if: always()
        run: |
          git config user.name "trial-bot"
          git config user.email "trial-bot@users.noreply.github.com"
          git add data DASHBOARD.md
          git diff --cached --quiet || (git commit -m "bot: post" && git pull --rebase && git push)
