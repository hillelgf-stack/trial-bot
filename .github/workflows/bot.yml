name: trial bot

on:
  schedule:
    # Every hour. The bot itself decides whether this hour is one of the best hours to post.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: trial-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python bot.py run
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: save state
        if: always()
        run: |
          git config user.name "trial-bot"
          git config user.email "trial-bot@users.noreply.github.com"
          git add data 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "bot: update state" && git pull --rebase && git push)
